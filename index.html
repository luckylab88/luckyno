<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lucky Number</title>

<style>
body{
    margin:0;
    font-family:"PingFang TC","Microsoft JhengHei",sans-serif;
    background:linear-gradient(135deg,#ffcc70,#ff8177);
    color:white;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    min-height:100vh;
    min-height:100dvh;
    text-align:center;
    overflow-x:hidden;
}

.container{
    width:100%;
    max-width:760px;
    box-sizing:border-box;
    padding:24px 14px 90px;
}

h1{
    font-size:clamp(34px,9vw,42px);
    margin:8px 0 14px;
    line-height:1.15;
}

.numbers{
    font-size:clamp(46px,12vw,64px);
    font-weight:bold;
    margin:18px 0 12px;
    line-height:1.22;
}

.main-numbers{
    line-height:1.28;
}

.sub-line{
    margin-top:14px;
    font-size:clamp(24px,6vw,32px);
    line-height:1.2;
}

.star-values{
    font-size:clamp(26px,6.5vw,32px);
}

.wish-line{
    margin-top:22px;
    color:#ffd700;
    font-size:26px;
    font-weight:bold;
    font-style:italic;
    line-height:1.2;
}

.wish-eu{
    font-size:20px;
    font-weight:600;
    letter-spacing:0.3px;
    white-space:nowrap;
}

.special-line{
    margin-top:16px;
    min-height:42px;
    font-size:clamp(30px,8vw,34px);
    line-height:1.15;
    color:#ff3b30;
}

.special-line.hidden{
    visibility:hidden;
}

button{
    background:white;
    color:#ff5f6d;
    border:none;
    padding:20px 36px;
    font-size:26px;
    border-radius:20px;
    cursor:pointer;
    font-weight:bold;
    animation:pulse 2s infinite;
}

.draw-button{
    margin-top:16px;
    padding:16px 30px;
    font-size:24px;
    border-radius:18px;
}

.modes{
    margin:16px 0 10px;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
}

.modes button{
  margin:0;
  padding:10px 16px;
  font-size:17px;
  border-radius:14px;
  border:none;
  background:rgba(255,255,255,0.2);
  color:white;
  font-weight:bold;
  cursor:pointer;
  animation:none;
}

.activeMode{
  background:white !important;
  color:#ff5f6d !important;
}

.special-toggle{
  margin-top:8px;
  padding:6px 10px;
  font-size:16px;
  border:none;
  background:transparent;
  color:rgba(255,255,255,0.9);
  font-weight:bold;
  cursor:pointer;
  animation:none;
}

.special-toggle:hover{
  opacity:0.75;
}

button:hover{
    opacity:0.9;
}

@keyframes pulse{
    0%{transform:scale(1);}
    50%{transform:scale(1.05);}
    100%{transform:scale(1);}
}

@media (max-height:740px){
    .container{
        padding-top:12px;
        padding-bottom:80px;
    }

    h1{
        font-size:34px;
        margin-bottom:10px;
    }

    .numbers{
        font-size:clamp(42px,11vw,58px);
        margin:12px 0 8px;
    }

    .wish-line{
        margin-top:16px;
        font-size:23px;
    }

    .wish-eu{
        font-size:18px;
    }

    .modes{
        margin:12px 0 8px;
        gap:7px;
    }

    .modes button{
        font-size:16px;
        padding:9px 13px;
    }

    .draw-button{
        margin-top:10px;
        font-size:22px;
        padding:14px 28px;
    }

    .special-toggle{
        margin-top:4px;
        font-size:15px;
    }
}
</style>
</head>

<body>

<div class="container">
    <h1>🍀 幸運號碼 🍀</h1>

    <div class="numbers" id="numbers">
    </div>

<div class="modes">
  <button onclick="setMode('uk')" id="ukBtn" class="activeMode">🇬🇧 UK Lotto</button>
  <button onclick="setMode('eu')" id="euBtn">🇪🇺 EuroMillions</button>
  <button onclick="setMode('hk')" id="hkBtn">🇭🇰 六合彩</button>
</div>
    <button class="draw-button" onclick="generateNumbers()">
        抽幸運號碼
    </button>
</div>

<script>
let currentMode = "uk";

function setMode(mode){

  currentMode = mode;

  document.getElementById("ukBtn").classList.remove("activeMode");
  document.getElementById("euBtn").classList.remove("activeMode");
  document.getElementById("hkBtn").classList.remove("activeMode");

  if(mode=="uk"){
    document.getElementById("ukBtn").classList.add("activeMode");
  }

  if(mode=="eu"){
    document.getElementById("euBtn").classList.add("activeMode");
  }

  if(mode=="hk"){
    document.getElementById("hkBtn").classList.add("activeMode");
  }
}

function pickNumbers(count, max){
  let numbers=[];

  while(numbers.length<count){
    let n=Math.floor(Math.random()*max)+1;
    if(!numbers.includes(n)){
      numbers.push(n);
    }
  }

  return numbers.sort((a,b)=>a-b);
}

let lastHkNumbers=[];
let lastHkSpecial=null;
let specialVisible=false;

function toggleSpecial(){
  let specialArea=document.getElementById("specialArea");
  let specialToggle=document.getElementById("specialToggle");

  if(!specialArea || !specialToggle){
    return;
  }

  specialVisible=!specialVisible;

  if(specialVisible){
    specialArea.classList.remove("hidden");
    specialToggle.innerHTML="▲ 隱藏特別號";
    navigator.clipboard.writeText("🇭🇰 六合彩\n正選: " + lastHkNumbers.join(", ") + "\n特別號: " + lastHkSpecial);
  }else{
    specialArea.classList.add("hidden");
    specialToggle.innerHTML="▼ 顯示特別號（複式參考）";
    navigator.clipboard.writeText("🇭🇰 六合彩\n正選: " + lastHkNumbers.join(", "));
  }
}

function generateNumbers(){

  let displayText="";
  let speakText="";
  let copyText="";
  let wish="✨祝你好運 ✨";

  if(currentMode=="uk"){
    let numbers=pickNumbers(6,59);
    displayText="<div class='main-numbers'>" + numbers.join(" , ") + "</div>";
    speakText="U K Lotto，幸運號碼係 " + numbers.join(" , ") + "。祝你好運。";
    copyText="🇬🇧 UK Lotto\nNumbers: " + numbers.join(", ");
    wish="✨ Good Luck! ✨";
  }

  if(currentMode=="eu"){
    let numbers=pickNumbers(5,50);
    let stars=pickNumbers(2,12);

    displayText=
      "<div class='main-numbers'>" + numbers.join(" , ") + "</div>" +
      "<div class='sub-line'>✨ Lucky Stars: <span class='star-values'>" + stars.join(" , ") + "</span></div>";
    speakText="Euro Millions，幸運號碼係 " + numbers.join(" , ") + "。幸運星號碼係 " + stars.join(" , ") + "。祝你好運。";
    copyText="🇪🇺 EuroMillions\nMain: " + numbers.join(", ") + "\nStars: " + stars.join(", ");
    wish="⭐ May the Stars be with you ⭐";
  }

  if(currentMode=="hk"){
    let numbers=pickNumbers(6,49);
    let special=pickNumbers(1,49)[0];

    while(numbers.includes(special)){
      special=pickNumbers(1,49)[0];
    }

    lastHkNumbers=numbers;
    lastHkSpecial=special;
    specialVisible=false;

    wish="🧧 祝你好運 🧧";
    speakText="六合彩幸運號碼係 " + numbers.join(" , ") + "。祝你好運。";
    copyText="🇭🇰 六合彩\n正選: " + numbers.join(", ");

    document.getElementById("numbers").innerHTML=
      "<div class='main-numbers'>" + numbers.join(" , ") + "</div>" +
      "<div id='specialArea' class='special-line hidden'>🔴 特別號：" + special + "</div>" +
      "<div class='wish-line'>" + wish + "</div>" +
      "<button class='special-toggle' id='specialToggle' onclick='toggleSpecial()'>▼ 顯示特別號（複式參考）</button>";

    navigator.clipboard.writeText(copyText);

    let speech=new SpeechSynthesisUtterance(speakText);
    speech.lang="zh-HK";
    speech.rate=1.1;
    speechSynthesis.speak(speech);

    return;
  }

  let wishClass = currentMode=="eu" ? "wish-line wish-eu" : "wish-line";

  document.getElementById("numbers").innerHTML=
    displayText + "<div class='" + wishClass + "'>" + wish + "</div>";

  navigator.clipboard.writeText(copyText);

  let speech=new SpeechSynthesisUtterance(speakText);
  speech.lang="zh-HK";
  speech.rate=1.1;
  speechSynthesis.speak(speech);
}
</script>

</body>
</html>
