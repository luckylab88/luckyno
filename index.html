<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lucky Number</title>

<style>
body{
    margin:0;
    font-family:"PingFang TC","Microsoft JhengHei",sans-serif;
    background:linear-gradient(135deg,#ffcc70,#ff8177);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    text-align:center;
}

.container{
    padding:30px;
}

h1{
    font-size:42px;
    margin-bottom:20px;
}

.numbers{
    font-size:48px;
    font-weight:bold;
    margin:30px 0;
}

button{
    background:white;
    color:#ff5f6d;
    border:none;
    padding:20px 36px;
    font-size:26px;
    border-radius:20px;
    cursor:pointer;
    font-weight:bold;
    animation:pulse 2s infinite;
}

    .modes{
  margin:20px 0;
}

.modes button{
  margin:6px;
  padding:12px 18px;
  font-size:18px;
  border-radius:14px;
  border:none;
  background:rgba(255,255,255,0.2);
  color:white;
  font-weight:bold;
  cursor:pointer;
  animation:none;
}

.activeMode{
  background:white !important;
  color:#ff5f6d !important;
}
button:hover{
    opacity:0.9;
    }
    @keyframes pulse{
    0%{transform:scale(1);}
    50%{transform:scale(1.05);}
    100%{transform:scale(1);}
}
</style>
</head>

<body>

<div class="container">
    <h1>🍀 幸運號碼 🍀</h1>

    <div class="numbers" id="numbers">
    </div>
    
<div class="modes">
  <button onclick="setMode('uk')" id="ukBtn" class="activeMode">🇬🇧 UK Lotto</button>
  <button onclick="setMode('eu')" id="euBtn">🇪🇺 EuroMillions</button>
  <button onclick="setMode('hk')" id="hkBtn">🇭🇰 六合彩</button>
</div>
    <button onclick="generateNumbers()">
        抽幸運號碼
    </button>
</div>

<script>
    let currentMode = "uk";

function setMode(mode){

  currentMode = mode;

  document.getElementById("ukBtn").classList.remove("activeMode");
  document.getElementById("euBtn").classList.remove("activeMode");
  document.getElementById("hkBtn").classList.remove("activeMode");

  if(mode=="uk"){
    document.getElementById("ukBtn").classList.add("activeMode");
  }

  if(mode=="eu"){
    document.getElementById("euBtn").classList.add("activeMode");
  }

  if(mode=="hk"){
    document.getElementById("hkBtn").classList.add("activeMode");
  }
}
function pickNumbers(count, max){
  let numbers=[];

  while(numbers.length<count){
    let n=Math.floor(Math.random()*max)+1;
    if(!numbers.includes(n)){
      numbers.push(n);
    }
  }

  return numbers.sort((a,b)=>a-b);
}

function generateNumbers(){

  let displayText="";
  let speakText="";
  let copyText="";
  let wish="✨祝你好運 ✨";

  if(currentMode=="uk"){
    let numbers=pickNumbers(6,59);
    displayText=numbers.join(" , ");
    speakText="U K Lotto，幸運號碼係 " + numbers.join(" , ") + "。祝你好運。";
    copyText="🇬🇧 UK Lotto\nNumbers: " + numbers.join(", ");
    wish="✨ Good Luck ✨";
  }

  if(currentMode=="eu"){
    let numbers=pickNumbers(5,50);
    let stars=pickNumbers(2,12);

    displayText=numbers.join(" , ") + "<br><span style='font-size:28px'>✨ Lucky Stars: </span><span style='font-size:32px'>" + stars.join(" , ") + "</span>";
    speakText="Euro Millions，幸運號碼係 " + numbers.join(" , ") + "。幸運星號碼係 " + stars.join(" , ") + "。祝你好運。";
    copyText="🇪🇺 EuroMillions\nMain: " + numbers.join(", ") + "\nStars: " + stars.join(", ");
    wish="⭐ Star Luck ⭐";
  }

  if(currentMode=="hk"){
    let numbers=pickNumbers(6,49);
    let special=pickNumbers(1,49)[0];

    while(numbers.includes(special)){
      special=pickNumbers(1,49)[0];
    }

    displayText=numbers.join(" , ") + "<br><span style='font-size:34px;color:#ff3b30'>🔴 特別號：" + special + "</span>";
    speakText="六合彩幸運號碼係 " + numbers.join(" , ") + "。特別號係 " + special + "。祝你好運。";
    copyText="🇭🇰 六合彩\n正選: " + numbers.join(", ") + "\n特別號: " + special;
    wish="🧧 祝你好運 🧧";
  }

  document.getElementById("numbers").innerHTML=
    displayText + "<br><br><span style='color:#ffd700;font-size:26px;font-weight:bold;font-style:italic'>" + wish + "</span>";

  navigator.clipboard.writeText(copyText);

  let speech=new SpeechSynthesisUtterance(speakText);
  speech.lang="zh-HK";
  speech.rate=1.1;
  speechSynthesis.speak(speech);
}
</script>

</body>
</html>
